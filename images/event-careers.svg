    <rect x="152" y="140" width="14" height="14"/><rect x="152" y="196" width="14" height="14"/>
    <rect x="236" y="212" width="14" height="14"/><rect x="266" y="252" width="14" height="14"/>
    <rect x="340" y="122" width="14" height="14"/><rect x="340" y="186" width="14" height="14"/>
