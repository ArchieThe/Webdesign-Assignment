<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of a study workshop: a lecture room with a whiteboard, clock and desks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="aSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27385e"/><stop offset="100%" stop-color="#16233f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#aSky)"/>
  <!-- whiteboard -->
  <rect x="120" y="70" width="430" height="220" rx="8" fill="#f4f6fa"/>
  <rect x="120" y="70" width="430" height="220" rx="8" fill="none" stroke="#0f7b7b" stroke-width="5"/>
  <g stroke="#27385e" stroke-width="7" stroke-linecap="round">
    <path d="M160 120h200M160 155h300M160 190h150"/>
  </g>
  <g stroke="#0f7b7b" stroke-width="7" stroke-linecap="round">
    <path d="M160 230h250"/>
  </g>
  <!-- pie chart on the board -->
  <circle cx="480" cy="200" r="42" fill="#e3eef2"/>
  <path d="M480 200 L480 158 A42 42 0 0 1 517 221 Z" fill="#c47f17"/>
  <path d="M480 200 L517 221 A42 42 0 0 1 443 221 Z" fill="#0f7b7b"/>
  <!-- clock -->
  <circle cx="640" cy="130" r="48" fill="#f4f6fa" stroke="#c47f17" stroke-width="6"/>
  <g stroke="#16233f" stroke-width="6" stroke-linecap="round">
    <path d="M640 130V100M640 130l24 16"/>
  </g>
  <!-- desks -->
  <g fill="#0f7b7b">
    <rect x="110" y="330" width="170" height="16" rx="6"/>
    <rect x="315" y="330" width="170" height="16" rx="6"/>
    <rect x="520" y="330" width="170" height="16" rx="6"/>
  </g>
  <g fill="#27385e">
    <rect x="128" y="346" width="12" height="46" rx="4"/><rect x="250" y="346" width="12" height="46" rx="4"/>
    <rect x="333" y="346" width="12" height="46" rx="4"/><rect x="455" y="346" width="12" height="46" rx="4"/>
    <rect x="538" y="346" width="12" height="46" rx="4"/><rect x="660" y="346" width="12" height="46" rx="4"/>
  </g>
  <!-- students -->
  <g fill="#c47f17">
    <circle cx="195" cy="300" r="20"/><circle cx="400" cy="300" r="20"/><circle cx="605" cy="300" r="20"/>
  </g>
  <rect x="0" y="406" width="800" height="44" fill="#0f7b7b"/>
  <text x="400" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Academic workshops &amp; study sessions</text>
</svg>
